services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      HOST: "0.0.0.0"
      NUXT_PUBLIC_API_BASE: "http://localhost:8000"
    depends_on:
      - backend
    restart: unless-stopped
