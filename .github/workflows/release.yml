name: Build and Release

# Triggered by a version tag push: git tag v1.2.3 && git push --tags
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write   # create GitHub release + upload zip
  packages: write   # push to GHCR

jobs:
  # ── Job 1: build both Docker images and push to GHCR ─────────────────────
  build:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: tag
        # GITHUB_REF_NAME is "v1.2.3" for a tag push
        run: echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/chrapchp/iomanager-backend:${{ steps.tag.outputs.version }}
            ghcr.io/chrapchp/iomanager-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/chrapchp/iomanager-frontend:${{ steps.tag.outputs.version }}
            ghcr.io/chrapchp/iomanager-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 2: package the release zip and attach it to the GitHub release ────
  release:
    name: Create GitHub release package
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release zip
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          PKG="iomanager-${VERSION}"
          mkdir -p "${PKG}/data/import" "${PKG}/data/export" "${PKG}/config"

          # Pin the exact version in the compose file users receive
          sed "s|:latest|:${VERSION}|g" docker-compose.release.yml > "${PKG}/docker-compose.yml"

          # Default config and user-facing README
          cp config/app.config.json "${PKG}/config/"
          cp RELEASE_README.md "${PKG}/README.md"

          # Keep files so empty folders survive the zip
          touch "${PKG}/data/import/.keep" "${PKG}/data/export/.keep"

          zip -r "${PKG}.zip" "${PKG}"

      - name: Create GitHub Release and upload zip
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.build.outputs.version }}
          draft: false
          generate_release_notes: true
          files: iomanager-${{ needs.build.outputs.version }}.zip
