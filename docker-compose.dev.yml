services:
  backend:
    # Hot-reload: mount source over the image layer
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./backend/app:/app/app
      - /etc/localtime:/etc/localtime:ro
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    # Replace the built image with a plain Node image that runs the dev server
    image: node:20-slim
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npx nuxt prepare && npx nuxt dev --host 0.0.0.0"
    environment:
      NUXT_PUBLIC_API_BASE: "http://localhost:8000"
    depends_on:
      - backend

volumes:
  frontend_node_modules:
